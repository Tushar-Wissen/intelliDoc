# Epic 0 / Story 0.1: one `docker compose up` starts core-api, ai-service,
# postgres, neo4j, redis, and minio. Frontend is extra (existing UI) and is
# not required for the six-service health gate.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intellidoc-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intellidoc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-intellidoc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - intellidoc-network

  neo4j:
    image: neo4j:5-community
    container_name: intellidoc-neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - intellidoc-network

  redis:
    image: redis:7-alpine
    container_name: intellidoc-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - intellidoc-network

  minio:
    # Docker Hub no longer serves minio/minio; official images are on Quay.
    image: quay.io/minio/minio:latest
    container_name: intellidoc-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - intellidoc-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: intellidoc-ai-service
    restart: always
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - intellidoc-network

  core-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intellidoc-core-api
    restart: always
    ports:
      - "${SPRING_BOOT_PORT:-8080}:8080"
    environment:
      - SPRING_BOOT_PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-intellidoc}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - AI_SERVICE_URL=http://ai-service:8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4jpassword}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - JWT_SECRET=${JWT_SECRET:-change-me-poc-only-must-be-at-least-256-bits-long}
      - JWT_EXPIRY_SECONDS=${JWT_EXPIRY_SECONDS:-86400}
      - SPRING_FLYWAY_REPAIR_ON_MIGRATE=${FLYWAY_REPAIR_ON_MIGRATE:-true}
      - SUPABASE_URL=${SUPABASE_URL:-https://demo-project.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-demo-anon-key}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - intellidoc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intellidoc-frontend
    restart: always
    ports:
      - "${REACT_PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - intellidoc-network

networks:
  intellidoc-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  minio_data:
