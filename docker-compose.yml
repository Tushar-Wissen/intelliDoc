services:
  # 1. Supabase / PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: intellidoc-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intellidoc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/20260911000000_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-intellidoc}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - intellidoc-network

  # 1b. MinIO Object Storage (uploaded document files)
  minio:
    image: quay.io/minio/minio:latest
    container_name: intellidoc-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intellidoc-network

  # 1c. Neo4j Graph Database (knowledge graph)
  neo4j:
    image: neo4j:5-community
    container_name: intellidoc-neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-intellidoc123}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intellidoc-network

  # 2. Python AI Service Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: intellidoc-ai-service
    restart: always
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OCR_ENGINE=${OCR_ENGINE:-paddle}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - intellidoc-network

  # 3. Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intellidoc-backend
    restart: always
    ports:
      - "${SPRING_BOOT_PORT:-8080}:8080"
    environment:
      - SPRING_BOOT_PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-intellidoc}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - AI_SERVICE_URL=http://ai-service:8000
      - SUPABASE_URL=${SUPABASE_URL:-https://demo-project.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-demo-anon-key}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - intellidoc-network

  # 4. React Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intellidoc-frontend
    restart: always
    ports:
      - "${REACT_PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_AI_SERVICE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - intellidoc-network

networks:
  intellidoc-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  neo4j_data:
