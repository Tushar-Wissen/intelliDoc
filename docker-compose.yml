version: '3.8'

services:
  # 1. Supabase / PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: intellidoc-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intellidoc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/20260911000000_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-intellidoc}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - intellidoc-network

  # 2. Python AI Service Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: intellidoc-ai-service
    restart: always
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - intellidoc-network

  # 3. Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intellidoc-backend
    restart: always
    ports:
      - "${SPRING_BOOT_PORT:-8080}:8080"
    environment:
      - SPRING_BOOT_PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-intellidoc}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - AI_SERVICE_URL=http://ai-service:8000
      - SUPABASE_URL=${SUPABASE_URL:-https://demo-project.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-demo-anon-key}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - intellidoc-network

  # 4. React Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intellidoc-frontend
    restart: always
    ports:
      - "${REACT_PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - intellidoc-network

networks:
  intellidoc-network:
    driver: bridge

volumes:
  postgres_data:
