openapi: 3.0.3
info:
  title: IntelliDoc AI Service API
  description: API contract between Spring Boot backend and Python AI Service microservice for document processing and Q&A.
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: checkHealth
      responses:
        '200':
          description: AI Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/analyze:
    post:
      summary: Analyze document text and extract summary, entities, key themes, and sentiment
      operationId: analyzeDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '200':
          description: Document analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400':
          description: Invalid input request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/extract:
    post:
      summary: Selectively merge native page text and OCR page text
      operationId: extractDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionRequest'
      responses:
        '200':
          description: Document text extracted with page-level provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionResponse'
        '400':
          description: No extractable text was supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/extract/file:
    post:
      summary: Extract text from a PDF, DOCX, or image upload
      operationId: extractDocumentFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document_id
                - file
              properties:
                document_id:
                  type: string
                  example: doc_12345
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded document extracted with page-level provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionResponse'
        '400':
          description: Invalid, unsupported, or unextractable upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/qa:
    post:
      summary: Answer question based on document context
      operationId: askQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QARequest'
      responses:
        '200':
          description: Question answered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAResponse'
        '400':
          description: Invalid input request

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: intellidoc-ai-service
        version:
          type: string
          example: 1.0.0
        model_loaded:
          type: boolean
          example: true

    AnalyzeRequest:
      type: object
      required:
        - document_id
        - content
      properties:
        document_id:
          type: string
          example: doc_12345
        title:
          type: string
          example: Quarterly Financial Report Q3.pdf
        content:
          type: string
          example: The company recorded revenue growth of 18% in Q3...
        max_summary_length:
          type: integer
          default: 150

    AnalyzeResponse:
      type: object
      required:
        - document_id
        - summary
        - entities
        - sentiment
        - key_topics
      properties:
        document_id:
          type: string
          example: doc_12345
        summary:
          type: string
          example: Executive summary highlighting 18% quarterly revenue growth...
        entities:
          type: array
          items:
            type: string
          example: ["Q3", "18% Revenue", "Finance Corp"]
        sentiment:
          type: string
          enum: [POSITIVE, NEUTRAL, NEGATIVE]
          example: POSITIVE
        key_topics:
          type: array
          items:
            type: string
          example: ["Revenue", "Earnings", "Financial Growth"]
        confidence_score:
          type: number
          format: float
          example: 0.95

    ExtractionRequest:
      type: object
      required:
        - document_id
        - pages
      properties:
        document_id:
          type: string
          example: doc_12345
        pages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ExtractionPage'

    ExtractionPage:
      type: object
      required:
        - page_number
      properties:
        page_number:
          type: integer
          minimum: 1
        native_text:
          type: string
        ocr_text:
          type: string
        ocr_confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1

    ExtractionResponse:
      type: object
      required:
        - document_id
        - pages
        - combined_text
        - ocr_pages
        - native_pages
      properties:
        document_id:
          type: string
        pages:
          type: array
          items:
            type: object
            required:
              - page_number
              - method
              - text
            properties:
              page_number:
                type: integer
              method:
                type: string
                enum: [native, ocr, unavailable]
              text:
                type: string
              confidence:
                type: number
                format: float
                nullable: true
        combined_text:
          type: string
        ocr_pages:
          type: array
          items:
            type: integer
        native_pages:
          type: array
          items:
            type: integer
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedSection'
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedChunk'
        extraction_version:
          type: string
          example: selective-ocr-v1

    ExtractedSection:
      type: object
      required:
        - section_id
        - heading
        - start_page
        - end_page
      properties:
        section_id:
          type: string
        heading:
          type: string
        parent_section_id:
          type: string
          nullable: true
        start_page:
          type: integer
        end_page:
          type: integer

    ExtractedChunk:
      type: object
      required:
        - chunk_id
        - page_number
        - chunk_text
        - token_count
      properties:
        chunk_id:
          type: string
        section_id:
          type: string
          nullable: true
        page_number:
          type: integer
        chunk_text:
          type: string
        token_count:
          type: integer

    QARequest:
      type: object
      required:
        - document_id
        - context
        - question
      properties:
        document_id:
          type: string
          example: doc_12345
        context:
          type: string
          example: The net margin increased to 22 percent in fiscal year 2025.
        question:
          type: string
          example: What was the net margin percentage?

    QAResponse:
      type: object
      required:
        - document_id
        - question
        - answer
        - confidence
      properties:
        document_id:
          type: string
          example: doc_12345
        question:
          type: string
          example: What was the net margin percentage?
        answer:
          type: string
          example: The net margin percentage increased to 22%.
        confidence:
          type: number
          format: float
          example: 0.92
        is_not_found:
          type: boolean
          example: false
        citations:
          type: array
          items:
            $ref: '#/components/schemas/QACitation'

    QACitation:
      type: object
      required:
        - source_excerpt
      properties:
        page_number:
          type: integer
          nullable: true
        source_excerpt:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
