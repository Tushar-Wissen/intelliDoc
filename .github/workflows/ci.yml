name: IntelliDoc Continuous Integration Pipeline

on:
  push:
  pull_request:

jobs:
  ai-service-ci:
    name: Build & Test Python AI Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install Dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          cd ai-service
          pytest -v

      - name: Build and tag Docker image
        run: |
          docker build -t intellidoc-ai-service:${{ github.sha }} ./ai-service

  backend-ci:
    name: Build & Test Spring Boot Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Unit Tests with Maven
        run: |
          cd backend
          mvn clean test package -B

      - name: Build and tag Docker image
        run: |
          docker build -t intellidoc-core-api:${{ github.sha }} ./backend

  frontend-ci:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies & Build SPA
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Build and tag Docker image
        run: |
          docker build -t intellidoc-frontend:${{ github.sha }} ./frontend

  docker-compose-ci:
    name: Verify Docker Compose Pipeline
    needs: [ai-service-ci, backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Docker Compose Configuration
        run: |
          docker compose config
