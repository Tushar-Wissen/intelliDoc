server:
  port: ${SPRING_BOOT_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: intellidoc-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:intellidoc}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Custom Application Config
intellidoc:
  ai-service:
    url: ${AI_SERVICE_URL:http://ai-service:8000}
  supabase:
    url: ${SUPABASE_URL:https://demo-project.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:demo-anon-key}

logging:
  level:
    root: INFO
    com.intellidoc: DEBUG












