server:
  port: ${SPRING_BOOT_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: intellidoc-backend

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:intellidoc}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    # Local docker volume can keep old checksums after SQL files are edited.
    repair-on-migrate: ${FLYWAY_REPAIR_ON_MIGRATE:true}

# Custom Application Config
intellidoc:
  ai-service:
    url: ${AI_SERVICE_URL:http://ai-service:8000}
  supabase:
    url: ${SUPABASE_URL:https://demo-project.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:demo-anon-key}
  jwt:
    secret: ${JWT_SECRET:change-me-poc-only-must-be-at-least-256-bits-long}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:86400}

logging:
  level:
    root: INFO
    com.intellidoc: DEBUG
