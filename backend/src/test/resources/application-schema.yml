spring:
  application:
    name: intellidoc-backend-schema
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

intellidoc:
  ai-service:
    url: http://localhost:8000
  jwt:
    secret: test-secret-must-be-at-least-256-bits-long-hs256
    expiry-seconds: 86400
  upload:
    max-file-size-bytes: 20971520
    allowed-extensions: pdf,docx
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: intellidoc
